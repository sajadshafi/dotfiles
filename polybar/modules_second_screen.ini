[module/playerctl]
type = custom/script
exec = playerctl metadata --format "{{ emoji(status) }} {{ artist }} — {{ title }}" | fribidi --ltr --nopad 2>/dev/null || echo "Nothing playing"
interval = 2
label = %{l}%output:0:60%

[module/hdmi_cava]
type = custom/script
tail = true
exec = $HOME/.config/polybar/scripts/cava_hdmi.sh
format = <label>
format-font = 3
label = %output%
label-foreground = ${colors.primary}
